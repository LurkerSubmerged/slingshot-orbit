<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slingshot Orbit</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #0b0b26 0%, #03030a 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .score-box {
            background: rgba(15, 15, 35, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a8ab0;
        }
        .score-val {
            font-size: 28px;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        #instructions-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 35, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.35);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            pointer-events: none;
            transition: opacity 0.5s;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
        }
        #game-over-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 10, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #game-over-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #0d0d26;
            border: 1px solid rgba(255, 0, 100, 0.35);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.25);
        }
        .modal-title {
            font-size: 36px;
            font-weight: 900;
            color: #ff0055;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
            letter-spacing: 2px;
        }
        .final-scores {
            margin-bottom: 30px;
        }
        .final-score-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 18px;
            color: #a0a0c0;
        }
        .final-score-val {
            font-weight: bold;
            color: #fff;
        }
        .restart-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border: none;
            color: white;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .restart-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div class="score-box">
                <span class="score-label">Score</span>
                <span id="score" class="score-val">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Best</span>
                <span id="high-score" class="score-val">0</span>
            </div>
        </div>
        <div id="instructions-hint">HOLD SCREEN / SPACE TO ATTACH ORBIT</div>
        <div id="game-over-modal">
            <div class="modal-content">
                <div class="modal-title">CRASH!</div>
                <div class="final-scores">
                    <div class="final-score-row">
                        <span>Score:</span>
                        <span id="final-score" class="final-score-val">0</span>
                    </div>
                    <div class="final-score-row">
                        <span>Best Score:</span>
                        <span id="final-best" class="final-score-val">0</span>
                    </div>
                </div>
                <button class="restart-btn" id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const finalBestEl = document.getElementById('final-best');
        const modal = document.getElementById('game-over-modal');
        const restartBtn = document.getElementById('restart-btn');
        const hintEl = document.getElementById('instructions-hint');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'attach') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'launch') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'crash' || type === 'pop' || type === 'splat') {
                // Realistic balloon pop sound: sharp transient burst + low-frequency pressure drop
                const bufferSize = audioCtx.sampleRate * 0.05; // 50ms noise burst
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(1200, now);
                noiseFilter.Q.setValueAtTime(1.5, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.7, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                // Thump (air expansion drop)
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);

                oscGain.gain.setValueAtTime(0.8, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);

                noise.start(now);
                osc.start(now);
                noise.stop(now + 0.05);
                osc.stop(now + 0.08);
            }
        }

        let width, height;
        let isTouching = false;
        let gameState = 'START';
        let score = 0;
        let highScore = localStorage.getItem('slingshot_highscore') || 0;
        highScoreEl.innerText = highScore;

        let cameraY = 0;
        let targetCameraY = 0;

        // Base speeds & progressive difficulty scaling
        const BASE_ORBIT_SPEED = 0.016;
        const BASE_LAUNCH_SPEED = 3.0;
        const ORBIT_SPEED_INCREMENT = 0.0006;
        const LAUNCH_SPEED_INCREMENT = 0.12;

        let ship = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius: 7,
            attachedPlanet: null,
            orbitAngle: 0,
            orbitSpeed: BASE_ORBIT_SPEED,
            orbitRadius: 80,
            orbitDir: 1,
            trail: []
        };

        let trail = []; // Engine light ribbon trail
        const MAX_TRAIL_LENGTH = 35;

        let planets = [];
        let particles = [];
        let stars = [];

        function resize() {
            width = Math.min(window.innerWidth, 480);
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (stars.length === 0) initStars();
        }
        window.addEventListener('resize', resize);

        function initStars() {
            stars = [];
            for (let i = 0; i < 75; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 3 - height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function createPlanet(y, index) {
            const minX = width * 0.25;
            const maxX = width * 0.75;
            const x = index === 0 ? width / 2 : minX + Math.random() * (maxX - minX);
            const radius = 22 + Math.random() * 12;
            const gravityRadius = radius * 3.8;
            const colors = ['#00f0ff', '#ff0055', '#ffbb00', '#00ff66', '#a100ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            return {
                id: index,
                x: x,
                y: y,
                radius: radius,
                gravityRadius: gravityRadius,
                color: color,
                passed: false
            };
        }

        function getCurrentOrbitSpeed() {
            return BASE_ORBIT_SPEED + (score * ORBIT_SPEED_INCREMENT);
        }

        function getCurrentLaunchSpeed() {
            return BASE_LAUNCH_SPEED + (score * LAUNCH_SPEED_INCREMENT);
        }

        function initGame() {
            score = 0;
            scoreEl.innerText = score;
            cameraY = 0;
            targetCameraY = 0;
            particles = [];
            planets = [];
            
            let startY = height - 180;
            for (let i = 0; i < 6; i++) {
                planets.push(createPlanet(startY, i));
                startY -= 180 + Math.random() * 40;
            }

            const p0 = planets[0];
            ship.attachedPlanet = p0;
            ship.orbitRadius = p0.radius + 40;
            ship.orbitAngle = -Math.PI / 2;
            ship.orbitDir = 1;
            ship.orbitSpeed = getCurrentOrbitSpeed();
            ship.x = p0.x + Math.cos(ship.orbitAngle) * ship.orbitRadius;
            ship.y = p0.y + Math.sin(ship.orbitAngle) * ship.orbitRadius;
            ship.vx = 0;
            ship.vy = 0;
            ship.trail = [];

            gameState = 'PLAYING';
            modal.classList.remove('active');
            hintEl.style.opacity = '1';
        }

        function handleInputStart(e) {
            if (e.type === 'touchstart') e.preventDefault();
            initAudio();
            if (gameState !== 'PLAYING') return;

            isTouching = true;
            hintEl.style.opacity = '0';

            if (!ship.attachedPlanet) {
                let closest = null;
                let minDist = Infinity;

                for (let p of planets) {
                    let dx = ship.x - p.x;
                    let dy = ship.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < p.gravityRadius && dist < minDist) {
                        minDist = dist;
                        closest = p;
                    }
                }

                if (closest) {
                    attachToPlanet(closest);
                }
            }
        }

        function handleInputEnd() {
            if (gameState !== 'PLAYING') return;
            isTouching = false;

            if (ship.attachedPlanet) {
                detachFromPlanet();
            }
        }

        function attachToPlanet(p) {
            ship.attachedPlanet = p;
            let dx = ship.x - p.x;
            let dy = ship.y - p.y;
            ship.orbitRadius = Math.sqrt(dx * dx + dy * dy);
            ship.orbitAngle = Math.atan2(dy, dx);
            
            let crossProduct = dx * ship.vy - dy * ship.vx;
            ship.orbitDir = crossProduct >= 0 ? 1 : -1;

            if (!p.passed && p.id > 0) {
                p.passed = true;
                score++;
                scoreEl.innerText = score;
                playSound('score');
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem('slingshot_highscore', highScore);
                }
            } else {
                playSound('attach');
            }

            ship.orbitSpeed = getCurrentOrbitSpeed();
            createBurst(ship.x, ship.y, p.color, 12);
        }

        function detachFromPlanet() {
            if (!ship.attachedPlanet) return;

            const tangentAngle = ship.orbitAngle + (Math.PI / 2) * ship.orbitDir;
            const launchSpeed = getCurrentLaunchSpeed();
            
            ship.vx = Math.cos(tangentAngle) * launchSpeed;
            ship.vy = Math.sin(tangentAngle) * launchSpeed;
            ship.attachedPlanet = null;

            playSound('launch');
            createBurst(ship.x, ship.y, '#ffffff', 8);
        }

        window.addEventListener('mousedown', handleInputStart);
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchstart', handleInputStart, { passive: false });
        window.addEventListener('touchend', handleInputEnd);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) handleInputStart(e);
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') handleInputEnd();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            initGame();
        });

        function createBurst(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    life: 1,
                    decay: Math.random() * 0.04 + 0.02,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (ship.attachedPlanet) {
                const p = ship.attachedPlanet;
                ship.orbitAngle += getCurrentOrbitSpeed() * ship.orbitDir;
                ship.x = p.x + Math.cos(ship.orbitAngle) * ship.orbitRadius;
                ship.y = p.y + Math.sin(ship.orbitAngle) * ship.orbitRadius;
            } else {
                ship.x += ship.vx;
                ship.y += ship.vy;

                // Check for auto-capture ONLY when user is actively holding touch/mouse/space
                if (isTouching) {
                    for (let p of planets) {
                        let dx = p.x - ship.x;
                        let dy = p.y - ship.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < p.gravityRadius) {
                            attachToPlanet(p);
                            break;
                        }
                    }
                }
            }

            ship.trail.push({ x: ship.x, y: ship.y, alpha: 1.0 });
            if (ship.trail.length > 20) {
                ship.trail.shift();
            }
            ship.trail.forEach(t => t.alpha -= 0.048);
            // Record tail position
            trail.unshift({ x: ship.x, y: ship.y });
            if (trail.length > MAX_TRAIL_LENGTH) trail.pop();

            for (let p of planets) {
                let dx = ship.x - p.x;
                let dy = ship.y - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < p.radius + ship.radius) {
                    gameOver();
                    return;
                }
            }

            if (ship.x < -40 || ship.x > width + 40) {
                gameOver();
                return;
            }

            const highestPlanetY = planets[planets.length - 1].y;
            if (ship.y < highestPlanetY + 400) {
                let lastY = planets[planets.length - 1].y;
                for (let i = 0; i < 3; i++) {
                    lastY -= 180 + Math.random() * 40;
                    planets.push(createPlanet(lastY, planets.length));
                }
            }

            if (planets.length > 20) {
                planets = planets.filter(p => p.y < ship.y + height);
            }

            targetCameraY = -ship.y + height * 0.65;
            cameraY += (targetCameraY - cameraY) * 0.1;

            if (ship.y > -cameraY + height + 100) {
                gameOver();
                return;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life -= pt.decay;
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('crash');
            createBurst(ship.x, ship.y, '#ff0055', 30);
            finalScoreEl.innerText = score;
            finalBestEl.innerText = highScore;
            modal.classList.add('active');
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Background Stars
            ctx.save();
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                let screenY = (s.y - cameraY * 0.2) % (height * 2);
                if (screenY < 0) screenY += height * 2;
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, screenY - height, s.size, s.size);
            });
            ctx.restore();

            ctx.save();
            ctx.translate(0, cameraY);

            // Draw Planets
            planets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.gravityRadius, 0, Math.PI * 2);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 6]);
                ctx.globalAlpha = 0.2;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1.0;

                let grad = ctx.createRadialGradient(p.x - p.radius * 0.3, p.y - p.radius * 0.3, 2, p.x, p.y, p.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, p.color);
                grad.addColorStop(1, '#000000');

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw Tether Line
            if (ship.attachedPlanet) {
                const p = ship.attachedPlanet;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(ship.x, ship.y);
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.6;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // Draw Neon Ribbon Trail
            if (trail.length > 1) {
                ctx.save();
                for (let i = 0; i < trail.length - 1; i++) {
                    let p1 = trail[i];
                    let p2 = trail[i + 1];
                    let alpha = 1 - (i / trail.length);
                    let lineWidth = (1 - (i / trail.length)) * 6 + 1;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = lineWidth;
                    ctx.globalAlpha = alpha * 0.85;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Draw Explosion Particles
            particles.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life;
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Spaceship
            if (gameState === 'PLAYING') {
                ctx.save();
                ctx.translate(ship.x, ship.y);

                let angle = ship.attachedPlanet 
                    ? ship.orbitAngle + (Math.PI / 2) * ship.orbitDir 
                    : Math.atan2(ship.vy, ship.vx);

                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(ship.radius * 1.6, 0);
                ctx.lineTo(-ship.radius, -ship.radius * 0.9);
                ctx.lineTo(-ship.radius * 0.4, 0);
                ctx.lineTo(-ship.radius, ship.radius * 0.9);
                ctx.closePath();

                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 14;
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();

            requestAnimationFrame(loop);
        }

        function loop() {
            update();
            draw();
        }

        resize();
        initGame();
        loop();
    </script>
</body>
</html>
